name: 刷课
on:
  push:
    branches: [ main ]
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: 拷贝代码
        uses: actions/checkout@v4

      - name: 设置python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: pip install -r ./requirements.txt

      - name: 运行main.py
        run: python main.py -u ${{ secrets.CHAXING_USER }} -p ${{ secrets.CHAXING_PWD }} -l 138371715
